’assurer que ton interlocuteur est vraiment notre responsable, demande-lui son code d’invitation et saisis-le ici.","verifyPlaceholder":"Code d’invitation (ex. T4K9PZM)","verifyButton":"Vérifier","verifyOk":"{{name}} est un véritable responsable Winway Partners.","verifyBad":"Ce code n’appartient à aucun de nos responsables. Ne partage ni informations personnelles ni argent avec cette personne ; préviens-nous à info@winway.com.tr.","howTitle":"Comment ça marche ?","how":[["Postule","Connecte-toi avec ton compte WinwayStats et remplis le formulaire de candidature."],["Validation","Nous examinons et validons ta candidature ; un Responsable partenaires t’est attribué."],["Partage","Récupère dans le panneau le lien de ta campagne et ton code partenaire ; partage-les avec ta communauté grâce aux bannières et aux QR codes."],["Sois payé","Pour les abonnements et les utilisateurs réguliers que tu apportes, par virement bancaire le 18 de chaque mois."]],"faqTitle":"Questions fréquentes","faqs":[["Comment les paiements sont-ils effectués ?","Le 18 de chaque mois, si ton solde disponible est de 1 000 ₺ ou plus, par virement sur un compte bancaire à ton nom. Un solde inférieur est reporté au mois suivant."],["Combien puis-je gagner ?","Tu touches 10 % des abonnements de tes utilisateurs ; ce taux peut augmenter avec le temps jusqu’à 20 %. Tes gains dépendent du nombre d’utilisateurs que tu apportes et de leurs abonnements ; tu vois tes vrais chiffres dans le panneau."],["Pourquoi mon solde peut-il apparaître négatif ?","Si le store rembourse un paiement, la part de ce paiement déjà passée dans ton solde disponible est déduite. C’est rare et cela apparaît sur une ligne distincte dans le panneau."],["Quels modèles de rémunération existent ?","Deux : la part sur les abonnements (à partir de 10 % des abonnements de tes utilisateurs, pouvant monter à 20 %, tant qu’ils restent abonnés) et le paiement par membre (unique, pour chaque nouveau membre qui utilise l’app régulièrement)."],
