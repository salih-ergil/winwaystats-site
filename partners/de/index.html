iben, und zusätzlich eine Mitgliedszahlung für jedes neue Mitglied, das die App regelmäßig nutzt. Ohne zeitliche Begrenzung.","apply":"Bewerben","login":"Partner-Anmeldung","stats":[["10 %","Abo-Anteil"],["Unbegrenzt","solange sie abonniert bleiben"],["Am 18.","regelmäßige Auszahlung"],["1.000 ₺","Mindestbetrag"]],"whyTitle":"Warum Winway Partners?","why":[["repeat","Ein Anteil, der weiterläuft, solange sie abonniert bleiben","Du erhältst einen Anteil an jeder Zahlung, solange dein Nutzer sein Abo behält. Ohne zeitliche Begrenzung."],["user","Mitgliedszahlung für regelmäßige Nutzer","Zusätzlich eine einmalige Zahlung für jedes neue Mitglied, das die App in den ersten 90 Tagen regelmäßig nutzt."],["image","Fertige Werbemittel","Bilder in Formaten für Telegram, Instagram und YouTube, Kampagnenlinks und QR-Codes."],["headset","Dein persönlicher Partnerbetreuer","Ein Betreuer an deiner Seite – von der Bewerbung bis zu deiner ersten Kampagne, mit Unterstützung bei deinen Fragen."],["wallet","Regelmäßige und transparente Auszahlungen","Am 18. jedes Monats per Banküberweisung. Eine Aufstellung jeder Auszahlung im Panel."],["chart","Statistiken in Echtzeit","Verfolge Klicks, Registrierungen, Abonnenten und Einnahmen im Panel Kampagne für Kampagne."]],"productTitle":"Was stellst du vor?","productIntro":"WinwayStats bietet seinen Nutzern die Spannung von Fußballtipps ohne echtes Geld im Spiel und zeigt ihnen ihre eigenen Tippgewohnheiten.","product":[["Kein echtes Geld im Spiel","Die Nutzer spielen mit Coins: 50.000 Coins am 1. jedes Monats. Coins können nicht gekauft, verkauft oder in Geld umgetauscht werden."],["Tippscheine und Live-Spiele","Tipps vor dem Spiel und live in Hunderten von Ligen, Tippscheine erstellen."],["Eigene Daten sehen","Budgetkontrolle und Entscheidungsanalyse zeigen Tippgewohnheiten, ohne zu werten."],["Team- und Spielstatistiken","Verteilung von Toren, Ecken und Karten, Teamvergleiche."],["Rangliste und Prämien","Man tritt mit Punkten an; Prämien hängen von Punkten ab, nicht von Geld. Die Bedingungen stehen in den Wettbewerbs- und Prämienregeln."],["Winway Plus","Abo-Pakete, die die Analysewerkzeuge freischalten. Dein Anteil stammt aus diesen Abos."]],"verifyTitle":"Ist die Person, die dich kontaktiert, unser Betreuer?","verifyText":"Unsere Partnerbetreuer können dich über Telegram oder per E-Mail kontaktieren. Um sicherzugehen, dass dein Gesprächspartner wirklich unser Betreuer ist, bitte ihn um seinen Einladungscode und gib ihn hier ein.","verifyPlaceholder":"Einladungscode (z. B. T4K9PZM)","verifyButton":"Prüfen","verifyOk":"{{name}} ist ein echter Winway-Partners-Betreuer.","verifyBad":"Dieser Code gehört keinem unserer Betreuer. Teile mit dieser Person keine persönlichen Daten und kein Geld; gib uns unter info@winway.com.tr Bescheid.","howTitle":"So funktioniert es","how":[["Bewerben","Melde dich mit deinem WinwayStats-Konto an und fülle das Bewerbungsformular aus."],["Genehmigung","Wir prüfen und genehmigen deine Bewerbung; dir wird ein Partnerbetreuer zugewiesen."],["Teilen","Hol dir im Panel deinen Kampagnenlink und Partnercode; teile sie mit Bannern und QR-Codes mit deiner Community."],["Auszahlung erhalten","Für die Abos und regelmäßigen Nutzer, die du bringst, am 18. jedes Monats per Banküberweisung."]],"faqTitle":"Häufige Fragen","faqs":[["Wie wird ausgezahlt?","Am 18. jedes Monats, wenn dein verfügbares Guthaben 1.000 ₺ oder mehr beträgt, per Überweisung auf ein Bankkonto auf deinen Namen. Ein niedrigeres Guthaben wird in den nächsten Monat übertragen."],["Wie viel kann ich verdienen?","Du erhältst 10 % Anteil an den Abos deiner Nutzer; dieser Satz kann mit der Zeit auf bis zu 20 % steigen. Deine Einnahmen hängen von der Anzahl deiner Nutzer und ihren Abos ab; deine echten Zahlen siehst du im Panel."],["Warum kann mein Guthaben negativ erscheinen?","Erstattet der Store eine Zahlung, wird der Anteil dieser Zahlung abgezogen, der bereits in dein verfügbares Guthaben übergegangen war. Das kommt selten vor und erscheint im Panel als eigene Zeile."],["Welche Vergütungsmodelle gibt es?","Zwei: den Abo-Anteil (ab 10 % der Abos deiner Nutzer, steigerbar auf bis zu 20 %, solange sie abonniert bleiben) und die Mitgliedszahlung (einmalig für jedes neue Mitglied, das die App regelmäßig nutzt)."],["Bekommen die Personen, die ich bringe, etwas?","Nein. Alle nutzen die App nach denselben Regeln; eingeladene Nutzer erhalten keine zusätzlichen Coins oder Vorteile."],["Kann ich die Personen sehen, die ich bringe?","Du siehst nur ihre Kontonummern, Pakete, ihren Abo-Status und die Beträge. Namen, Benutzernamen und Aktivitäten in der App werden nicht angezeigt."],["Kann ich aus dem Ausland teilnehmen?","Ja. Dein Anteil wird gebucht und angesammelt; sobald Auslandsauszahlungen möglich sind, wird dein angesammeltes Guthaben ausgezahlt."],["Wie darf ich nicht werben?","WinwayStats ist keine Wettseite und darf nicht als solche beworben werden. Aussagen wie „Geld verdienen“ oder „sicherer Gewinn“ sind nicht erlaubt; Nutzern dürfen für die Registrierung keine Geschenke oder kein Geld gegeben werden."]],"ctaTitle":"Bring deine Community mit WinwayStats zusammen","ctaText":"Melde dich zum Bewerben mit deinem WinwayStats-Konto an. Wenn du noch kein Konto hast, kannst du es in wenigen Minuten erstellen.","noAccount":"Kein Konto? Kostenloses WinwayStats-Konto erstellen","createAccount":"WinwayStats-Konto erstellen","createHint":"Für die Bewerbung brauchst du ein WinwayStats-Konto. Wenn du keins hast, erstelle zuerst dein kostenloses Konto und bewirb dich dann."},"signOutSafe":"Sicher abmelden","live":{"loading":"Wird geladen…","closedTitle":"Winway Partners ist noch nicht gestartet","closedText":"Das Programm befindet sich noch in Vorbereitung. Sobald es startet, kannst du dich auf dieser Seite bewerben.","reviewTitle":"Deine Bewerbung wird geprüft","contractTitle":"Die Vereinbarung wurde aktualisiert","contractText":"Eine neue Version ({{v}}) der Winway-Partners-Partnerschaftsvereinbarung
