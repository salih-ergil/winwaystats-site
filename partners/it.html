i. Nomi, nomi utente e attività nell’app non vengono mostrati."],["Posso partecipare dall’estero?","Sì. La tua quota viene registrata e si accumula; il saldo accumulato viene pagato quando si apriranno i pagamenti internazionali."],["Come non posso promuoverlo?","WinwayStats non è un sito di scommesse e non può essere promosso come tale. Non si possono usare frasi come «guadagna soldi» o «vincita sicura»; non si possono dare regali o soldi agli utenti in cambio dell’iscrizione."]],"ctaTitle":"Fai conoscere WinwayStats alla tua community","ctaText":"Per candidarti, accedi con il tuo account WinwayStats. Se non hai un account, puoi crearlo in pochi minuti.","noAccount":"Non hai un account? Crea un account WinwayStats gratuito","createAccount":"Crea un account WinwayStats","createHint":"Per candidarti serve un account WinwayStats. Se non ce l’hai, crea prima il tuo account gratuito e poi candidati."},"signOutSafe":"Esci in sicurezza","live":{"loading":"Caricamento…","closedTitle":"Winway Partners non è ancora aperto","closedText":"Il programma è in preparazione. Quando aprirà potrai candidarti da questa pagina.","reviewTitle":"Stiamo esaminando la tua candidatura","contractTitle":"Il contratto è stato aggiornato","contractText":"È disponibile una nuova versione ({{v}}) del Contratto di partnership di Winway Partners. Per continuare al pannello devi leggere e accettare il nuovo testo. Fino ad allora i tuoi guadagni e pagamenti non cambiano.","contractRead":"Contratto di partnership","contractCheck":": ho letto e accetto la versione {{v}}.","contractButton":"Accetta e continua","contractNeedCheck":"Spunta la casella per continuare.","reviewText":"Abbiamo ricevuto la tua candidatura (n. partner {{no}}). Ti avviseremo via e-mail dopo averla esaminata.","rejectedText":"La tua candidatura precedente non è stata approvata. Puoi aggiornare i tuoi dati e candidarti di nuovo.","rejectReasonLabel":"Motivo","rejectNoteLabel":"Nota","rejectReasons":{"kanal":"Non è stato possibile v
